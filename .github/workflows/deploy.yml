name: Build and Deploy React App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Laravel dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Upload Laravel app
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/*"
          target: ${{ secrets.VPS_BACKEND }}
          strip_components: 1
          overwrite: true

      - name: Stage Hestia web root
        env:
          VPS_BACKEND: ${{ secrets.VPS_BACKEND }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          backend = os.environ.get('VPS_BACKEND', '').strip().rstrip('/')
          if not backend:
              raise SystemExit('VPS_BACKEND secret is missing')
          if any(character in backend for character in ["'", '\n', '\r', '\0']):
              raise SystemExit('VPS_BACKEND contains invalid characters')

          source = Path('backend/hestia/index.php').read_text()
          placeholder = '__JUHEN_BACKEND_PATH__'
          if placeholder not in source:
              raise SystemExit('index.php is missing the backend path placeholder')

          Path('dist').mkdir(exist_ok=True)
          Path('dist/index.php').write_text(source.replace(placeholder, backend))
          Path('dist/.htaccess').write_bytes(Path('backend/hestia/.htaccess').read_bytes())
          PY

      - name: Upload site files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*,dist/.htaccess"
          target: ${{ secrets.VPS_TARGET }}
          strip_components: 1
          overwrite: true

      - name: Finish Laravel on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_BACKEND }}"
            mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
            touch database/database.sqlite
            chmod -R ug+rwx storage bootstrap/cache
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
